<!-- Resultados de la selección de celdas (recuento, suma y promedio) -->
<div class="ps-seleccion" id="panelSeleccion">
  <div class="ps-seleccion-datos" id="seleccionDatos" style="display: none;">
    <span class="badge-estado badge-neutro ps-seleccion-rango" id="seleccionRango"></span>
    <span class="ps-seleccion-resultado" id="seleccionResultados"></span>
    <button type="button" class="btn btn-primary btn-sm ps-seleccion-btn" id="btnCopiarSeleccion"
      title="Copiar los resultados de la selección">
      <i class="fas fa-copy"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm ps-seleccion-btn" id="btnCerrarSeleccion"
      title="Cerrar la selección">
      <i class="fas fa-xmark"></i>
    </button>
  </div>
</div>
