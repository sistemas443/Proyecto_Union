{% extends 'generales/layout.html' %}

{% block head %}{% include 'planta_alimentos/_design_system.html' %}{% endblock %}

{% block content %}
<div class="container-fluid py-4">

    <!-- Encabezado -->
    <div class="page-header">
        <div>
            <h1 class="page-title">
                <i class="fas fa-truck-loading me-2"></i>Recepción de Mercancía
            </h1>
            <p class="page-subtitle">Entrada a inventario de materia prima recibida</p>
        </div>
        <a href="{{ url_for('planta_alimentos.listar_ordenes_compra') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Volver a Órdenes
        </a>
    </div>

    <!-- Formulario -->
    <div class="row">
        <div class="col-lg-7 col-xl-6 mx-auto">
            <div class="card card-clean">
                <div class="card-header">
                    <i class="fas fa-box-open me-1"></i> Datos de la Recepción
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('planta_alimentos.recepcion_compras') }}">

                        <div class="mb-3">
                            <label class="form-label-design" for="materia_prima_id">Materia Prima</label>
                            <select name="materia_prima_id" id="materia_prima_id" class="form-select" required>
                                <option value="">Seleccione una materia prima...</option>
                                {% for mp in materias_primas %}
                                <option value="{{ mp['id'] }}">{{ mp['nombre'] }} ({{ mp['unidad_medida'] }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label-design" for="lote_ingreso">Número de Lote / Factura</label>
                                <input type="text" name="lote_ingreso" id="lote_ingreso" class="form-control"
                                    placeholder="Ej: LOT-20260901" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label-design" for="cantidad">Cantidad Recibida</label>
                                <input type="number" step="0.01" name="cantidad" id="cantidad" class="form-control"
                                    placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label-design" for="costo_unitario">Costo Unitario ($)</label>
                                <input type="number" step="0.01" name="costo_unitario" id="costo_unitario"
                                    class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label-design" for="fecha_vencimiento">Fecha Vencimiento (Opcional)</label>
                                <input type="date" name="fecha_vencimiento" id="fecha_vencimiento" class="form-control">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{{ url_for('planta_alimentos.listar_ordenes_compra') }}"
                                class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Registrar Entrada e Incrementar Inventario
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
