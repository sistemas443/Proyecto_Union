{% extends 'layout.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-truck-loading me-2"></i>Recepción de Mercancía / Entrada a Inventario</h2>
        <a href="{{ url_for('planta_alimentos.listar_ordenes_compra') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i> Volver a Órdenes
        </a>
    </div>

    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-body">
            <form method="POST" action="{{ url_for('planta_alimentos.recepcion_compras') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Materia Prima</label>
                    <select name="materia_prima_id" class="form-select" required>
                        <option value="">Seleccione una materia prima...</option>
                        {% for mp in materias_primas %}
                        <option value="{{ mp['id'] }}">{{ mp['nombre'] }} ({{ mp['unidad_medida'] }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de Lote / Factura Ingreso</label>
                        <input type="text" name="lote_ingreso" class="form-control" placeholder="Ej: LOT-20260901"
                            required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cantidad Recibida</label>
                        <input type="number" step="0.01" name="cantidad" class="form-control" placeholder="0.00"
                            required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Costo Unitario ($)</label>
                        <input type="number" step="0.01" name="costo_unitario" class="form-control" placeholder="0.00"
                            required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha Vencimiento (Opcional)</label>
                        <input type="date" name="fecha_vencimiento" class="form-control">
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 mt-3">
                    <i class="fas fa-save me-1"></i> Registrar Entrada e Incrementar Inventario
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
