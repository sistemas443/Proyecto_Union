{% extends 'layout.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-file-invoice me-2"></i>Nueva Orden de Compra</h2>
        <a href="{{ url_for('planta_alimentos.listar_ordenes_compra') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i> Cancelar
        </a>
    </div>

    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-body">
            <form method="POST" action="{{ url_for('planta_alimentos.nueva_orden_compra') }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Proveedor</label>
                    <select name="proveedor_id" class="form-select" required>
                        <option value="">Seleccione un proveedor...</option>
                        {% for p in proveedores %}
                        <option value="{{ p['id'] }}">{{ p['nombre'] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observaciones / Notas</label>
                    <textarea name="observaciones" class="form-control" rows="3"
                        placeholder="Detalles de la orden, condiciones de pago, etc."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-save me-1"></i> Generar Orden de Compra
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
