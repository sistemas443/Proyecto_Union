{% extends 'layout.html' %}

{% block content %}
<div class="container-fluid mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-calendar-alt me-2 text-primary"></i>Captura Diario de Compras (Matriz)</h2>
        <a href="{{ url_for('planta_alimentos.matriz_mensual_compras') }}" class="btn btn-secondary shadow-sm">
            <i class="fas fa-table me-1"></i> Ver Matriz Mensual
        </a>
    </div>

    <form method="POST" action="{{ url_for('planta_alimentos.guardar_ingreso_diario') }}">
        
        <!-- Tarjeta 1: Datos Generales del Día -->
        <div class="card shadow-sm border-0 mb-3 bg-light">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <label class="form-label font-weight-bold">Día del Periodo / Mes:</label>
                        <input type="number" name="dia_numero" class="form-control form-control-lg font-weight-bold text-center text-primary" min="1" max="31" placeholder="Ej: 15" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label font-weight-bold">Fecha del Registro:</label>
                        <input type="date" name="fecha_registro" class="form-control" value="{{ hoy }}" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label font-weight-bold">Observación / Lote General:</label>
                        <input type="text" name="observacion_general" class="form-control" placeholder="Ej: Ingreso correspondiente a mulas del día">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tarjeta 2: Tabla Dinámica de Materias Primas -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-dark text-white font-weight-bold d-flex justify-content-between align-items-center py-3">
                <span class="fs-5"><i class="fas fa-boxes me-2"></i> Captura de Cantidades y Valores</span>
                <!-- Botón Añadir Mejorado (Azul Primario para resaltar) -->
                <button type="button" class="btn btn-primary shadow-sm" id="btn-add-row">
                    <i class="fas fa-plus me-1"></i> Añadir Ingrediente
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle mb-0" id="tabla-materias-primas">
                        <thead class="table-primary text-center">
                            <tr>
                                <!-- Anchos ajustados para dar espacio al botón de acción -->
                                <th style="width: 30%;">Materia Prima / Ingrediente</th>
                                <th style="width: 20%;">Cantidad (Gramos)</th>
                                <th style="width: 20%;">Costo Total ($) / Mula</th>
                                <th style="width: 20%;">Nº Lote / Remisión</th>
                                <th style="width: 10%;">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="fila-ingreso">
                                <td>
                                    <select name="materia_prima_id[]" class="form-select border-primary" required>
                                        <option value="">Seleccione el ingrediente...</option>
                                        {% for mp in materias_primas %}
                                            <option value="{{ mp['id'] }}">{{ mp['nombre'] }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td>
                                    <input type="number" step="0.01" name="cantidad[]" class="form-control text-end" placeholder="0.00" required>
                                </td>
                                <td>
                                    <input type="number" step="0.01" name="costo[]" class="form-control text-end" placeholder="0.00">
                                </td>
                                <td>
                                    <input type="text" name="lote[]" class="form-control text-center" placeholder="Opcional">
                                </td>
                                <td class="text-center">
                                    <!-- Botón Eliminar Mejorado (Tamaño normal, icono claro) -->
                                    <button type="button" class="btn btn-outline-danger btn-remove-row px-3" title="Eliminar fila">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm py-3 fs-5">
            <i class="fas fa-save me-2"></i> Guardar Día e Incrementar Inventario
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tableBody = document.querySelector('#tabla-materias-primas tbody');
    const btnAddRow = document.getElementById('btn-add-row');

    // Agregar nueva fila clonando la primera
    btnAddRow.addEventListener('click', function() {
        const firstRow = tableBody.querySelector('.fila-ingreso');
        const newRow = firstRow.cloneNode(true);

        // Limpiar los valores de la fila clonada
        newRow.querySelector('select').value = '';
        const inputs = newRow.querySelectorAll('input');
        inputs.forEach(input => input.value = '');

        // Añadir la fila clonada al final de la tabla
        tableBody.appendChild(newRow);
    });

    // Eliminar fila
    tableBody.addEventListener('click', function(e) {
        // Buscar si se hizo clic en el botón o dentro del icono del botón
        const btnRemove = e.target.closest('.btn-remove-row');
        
        if (btnRemove) {
            const rows = tableBody.querySelectorAll('.fila-ingreso');
            if (rows.length > 1) {
                btnRemove.closest('tr').remove();
            } else {
                alert('Debe haber al menos un ingrediente en la lista.');
            }
        }
    });
});
</script>
{% endblock %}
