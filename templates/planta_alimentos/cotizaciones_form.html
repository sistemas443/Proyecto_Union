{% extends 'generales/layout.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 fw-bold text-dark mb-0">Nueva Cotización</h1>
        <a href="{{ url_for('planta_alimentos.cotizaciones.cotizaciones_list') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Volver
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Crear Nueva Cotización</h5>
        </div>
        <div class="card-body">
            <form method="POST" class="needs-validation" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="mes" class="form-label fw-bold">Mes</label>
                        <select class="form-select form-select-sm" id="mes" name="mes" required>
                            <option value="" disabled selected>Seleccionar mes...</option>
                            <option value="1">Enero</option>
                            <option value="2">Febrero</option>
                            <option value="3">Marzo</option>
                            <option value="4">Abril</option>
                            <option value="5">Mayo</option>
                            <option value="6">Junio</option>
                            <option value="7">Julio</option>
                            <option value="8">Agosto</option>
                            <option value="9">Septiembre</option>
                            <option value="10">Octubre</option>
                            <option value="11">Noviembre</option>
                            <option value="12">Diciembre</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="anio" class="form-label fw-bold">Año</label>
                        <select class="form-select form-select-sm" id="anio" name="anio" required>
                            {% for y in range(2024, 2030) %}
                            <option value="{{ y }}" {% if y == 2025 %}selected{% endif %}>{{ y }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i> Crear Cotización
                    </button>
                    <a href="{{ url_for('planta_alimentos.cotizaciones.cotizaciones_list') }}" class="btn btn-outline-secondary ms-2">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
