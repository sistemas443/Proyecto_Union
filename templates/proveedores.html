{% extends 'layout.html' %}

{% block content %}
<div class="container py-4">
    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <h2 class="h4 text-primary fw-bold mb-0">
                <i class="fas fa-truck me-2"></i> Gestión de Proveedores
            </h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="{{ url_for('main.materias_primas') }}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i> Ir a Materias Primas
            </a>
        </div>
    </div>

    <div class="row">
        <!-- Registrar Proveedor -->
        <div class="col-md-4 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white pt-4 pb-0 border-0">
                    <h6 class="fw-bold text-secondary">Nuevo Proveedor</h6>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('main.proveedores') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small">Nombre Empresa / Proveedor</label>
                            <input type="text" name="nombre" class="form-control form-control-sm text-uppercase" placeholder="Ej. ITALCOL" required autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">
                            <i class="fas fa-save me-1"></i> Guardar Proveedor
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lista de Proveedores -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="px-3">ID</th>
                                    <th>NOMBRE DEL PROVEEDOR</th>
                                    <th class="text-center px-3" style="width: 120px;">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for prov in proveedores %}
                                <tr>
                                    <td class="px-3 text-muted">{{ prov['id'] }}</td>
                                    <td>
                                        <input type="text" form="form-prov-{{ prov['id'] }}" name="nombre" value="{{ prov['nombre'] }}" class="form-control form-control-sm border-0 bg-transparent fw-bold text-uppercase" required>
                                    </td>
                                    <td class="text-center px-3">
                                        <div class="d-flex justify-content-center gap-1">
                                            <form id="form-prov-{{ prov['id'] }}" method="POST" action="{{ url_for('main.editar_proveedor', id_prov=prov['id']) }}"></form>

                                            <button type="submit" form="form-prov-{{ prov['id'] }}" class="btn btn-sm btn-outline-primary border-0 p-1" title="Guardar Cambios">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                                </svg>
                                            </button>

                                            <form method="POST" action="{{ url_for('main.eliminar_proveedor', id_prov=prov['id']) }}" onsubmit="return confirm('¿Eliminar este proveedor?');" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger border-0 p-1" title="Eliminar Proveedor">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                                                        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.937 16h6.126a2 2 0 0 0 1.997-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92H4.937a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                                                    </svg>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                {% else %}
                                <tr>
                                    <td colspan="3" class="text-center py-4 text-muted">No hay proveedores registrados.</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
